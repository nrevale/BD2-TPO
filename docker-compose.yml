# Entorno FarmaRed: MongoDB (replica set de un nodo, para transacciones) + Neo4j + contenedor de la app.
# Lo usa el devcontainer de Codespaces y también sirve local: `docker compose up -d`.
name: farmared

services:
  mongo:
    image: mongo:8.2
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Inicializa el replica set una sola vez y espera a que el nodo sea primario.
  # Si ya estaba inicializado (volumen existente), solo verifica y termina.
  mongo-init:
    image: mongo:8.2
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command:
      - mongosh
      - --host
      - mongo
      - --quiet
      - --eval
      - |
        try { rs.status(); print('replica set ya inicializado'); }
        catch (e) {
          if (e.codeName !== 'NotYetInitialized') { throw e; }
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] });
          print('replica set rs0 inicializado');
        }
        let intentos = 0;
        while (!db.hello().isWritablePrimary && intentos < 60) { sleep(1000); intentos++; }
        if (!db.hello().isWritablePrimary) { print('el nodo no llegó a primario'); quit(1); }
        print('mongo listo: primario de rs0');

  neo4j:
    image: neo4j:5.26-community
    environment:
      # Ojo: Neo4j interpreta toda variable NEO4J_* como setting; no agregar otras.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-farmared123}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - .:/workspace:cached
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DB: ${MONGO_DB:-farmared}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-farmared123}
      FARMARED_HOY: ${FARMARED_HOY:-}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy

volumes:
  mongo-data:
  neo4j-data:
